<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>하루 기록장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Myeongjo:wght@700;800&display=swap">
<style>
/* Layout: a field notebook — one narrow column of ruled sections, tabs as a binder index, numbers in mono. */
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --sunk:#E7ECE8; --ink:#1C2521; --muted:#5B6862; --line:#D7DFD9;
  --accent:#2F6B4F; --accent-ink:#FFFFFF; --accent-soft:#DCEBE2;
  --ex:#13827E; --rd:#4554BE; --diet:#B06F12;
  --low:#D9820B; --ok:#2E8656; --high:#C23E2B;
  --f-display:"Nanum Myeongjo","Noto Serif KR",Georgia,serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#19201D; --sunk:#222A26; --ink:#E4EBE7; --muted:#97A59E; --line:#2C3632;
  --accent:#71C39C; --accent-ink:#0E1A14; --accent-soft:#1F3328;
  --ex:#45C3BD; --rd:#929DF2; --diet:#E2A64C; --low:#F1A43B; --ok:#5DC68B; --high:#F27A66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#19201D; --sunk:#222A26; --ink:#E4EBE7; --muted:#97A59E; --line:#2C3632;
  --accent:#71C39C; --accent-ink:#0E1A14; --accent-soft:#1F3328;
  --ex:#45C3BD; --rd:#929DF2; --diet:#E2A64C; --low:#F1A43B; --ok:#5DC68B; --high:#F27A66; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
.wrap{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header + tabs */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:1.45rem;font-weight:800}
.brand .today{color:var(--muted);font-size:.82rem}
.top-row .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;padding:3px 9px;border-radius:99px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.chip.on .dot{background:var(--ok)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:1;text-align:center;padding:9px 6px 10px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2.5px solid transparent;white-space:nowrap;min-width:64px}
nav.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

main{padding-block:20px 120px}
section.view{display:flex;flex-direction:column;gap:22px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:1.25rem;font-weight:800}
.sec-head .sub{color:var(--muted);font-size:.85rem}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:640px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2.stack{grid-template-columns:1fr}}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-num);font-size:1.45rem;font-variant-numeric:tabular-nums}
.stat .v small{font-size:.8rem;color:var(--muted);margin-left:2px}
.stat .k{font-size:.8rem;color:var(--muted)}
.tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:99px;border:1px solid currentColor;line-height:1.6;white-space:nowrap}
.c-ex{color:var(--ex)} .c-rd{color:var(--rd)} .c-diet{color:var(--diet)}
.c-low{color:var(--low)} .c-ok{color:var(--ok)} .c-high{color:var(--high)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--ink)}
.btn.danger{color:var(--high)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.quick .btn{flex:1;min-width:120px;padding:12px}
.quick .btn b{font-weight:600}

/* lists */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;overflow-wrap:anywhere}
.row .m{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere}
.row .r{font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.daylabel{font-size:.8rem;color:var(--muted);font-weight:600;padding-top:14px}
.empty{color:var(--muted);text-align:center;padding:22px 10px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{margin:0;max-width:34ch}

/* bars */
.nbar{display:grid;grid-template-columns:7.2em minmax(0,1fr) 7.5em;align-items:center;gap:10px;padding:5px 0;font-size:.88rem}
.nbar .track{height:8px;background:var(--sunk);border-radius:99px;position:relative;overflow:hidden}
.nbar .fill{position:absolute;inset:0 auto 0 0;border-radius:99px}
.nbar .amt{text-align:right;font-family:var(--f-num);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.nbar .nm{display:flex;gap:6px;align-items:center}
.nbar .nm i{width:7px;height:7px;border-radius:50%;flex:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%}
.bg-low{background:var(--low)} .bg-ok{background:var(--ok)} .bg-high{background:var(--high)}

.meter{display:flex;align-items:center;gap:16px}
.ring{width:84px;height:84px;flex:none}
.ring text{font-family:var(--f-num);fill:var(--ink)}

/* deficiency cards */
.def{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.def:first-child{border-top:0;padding-top:0}
.def h3{font-family:var(--f-body);font-size:1rem;font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.def p{margin:0;color:var(--muted);font-size:.88rem}
.foods{display:flex;flex-wrap:wrap;gap:6px}
.foods span{font-size:.8rem;background:var(--sunk);padding:3px 9px;border-radius:6px}
.suggest{font-size:.88rem;background:var(--accent-soft);padding:8px 10px;border-radius:8px}
.note{font-size:.82rem;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center}
.cal .dow{font-size:.72rem;color:var(--muted);padding-bottom:4px}
.cal .d{padding:6px 0 4px;border-radius:6px;font-family:var(--f-num);font-size:.82rem;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:44px}
.cal .d.today{background:var(--accent-soft);font-weight:600}
.cal .d.out{visibility:hidden}
.cal .dots{display:flex;gap:2px;height:6px}
.cal .dots i{width:6px;height:6px;border-radius:50%}
.calnav{display:flex;align-items:center;gap:6px}

.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.chart-box{position:relative;height:220px}
.chart-box.sm{height:200px}

.datebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.datebar input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px}

.meal{display:flex;flex-direction:column;gap:2px}
.meal-head{display:flex;justify-content:space-between;align-items:center;padding-top:6px}
.meal-head b{font-weight:600}
.meal-head .r{font-family:var(--f-num);font-size:.82rem;color:var(--muted)}

.book{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.book:first-child{border-top:0}
.spine{width:6px;align-self:stretch;border-radius:3px;background:var(--rd);flex:none;opacity:.8}
.book .main{flex:1;min-width:0}
.book .t{font-family:var(--f-display);font-weight:700;font-size:1.02rem}
.stars{color:var(--diet);letter-spacing:1px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.hl{background:var(--accent-soft);border-radius:3px}
.quote{white-space:pre-wrap;font-size:.9rem;margin-top:4px;border-left:2px solid var(--rd);padding-left:10px;color:var(--ink)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,15,12,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.backdrop{align-items:center}.sheet{border-radius:16px;max-height:86%}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{font-size:1.2rem;font-weight:800}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.field .lb{font-size:.82rem;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
.field textarea{min-height:110px;resize:vertical}
.fields{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.fields .full{grid-column:1/-1}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.actions .grow{flex:1}
.err{color:var(--high);font-size:.85rem;margin:0}
.results{display:flex;flex-direction:column;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.results button{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer}
.results button:first-child{border-top:0}
.results button:hover,.results button[aria-selected="true"]{background:var(--accent-soft)}
.results .m{color:var(--muted);font-size:.8rem;white-space:nowrap}
.favs{display:flex;gap:6px;flex-wrap:wrap}
.favs button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 11px;font-size:.82rem;cursor:pointer}
.favs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.picked{background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.ratepick{display:flex;gap:4px}
.ratepick button{border:1px solid var(--line);background:var(--bg);border-radius:6px;width:38px;height:34px;cursor:pointer;color:var(--diet);font-size:1rem}
.ratepick button[aria-pressed="true"]{background:var(--diet);color:var(--surface);border-color:var(--diet)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.88rem;z-index:60;max-width:calc(100% - 32px)}
footer.disc{color:var(--muted);font-size:.78rem;text-align:center;padding-top:8px}

@media (max-width:719px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:0 max(4px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(4px,env(safe-area-inset-left,0px));z-index:25}
  nav.tabs a{border-bottom:0;border-top:2.5px solid transparent;padding:10px 4px 12px;min-width:0}
  nav.tabs a[aria-current="page"]{border-color:var(--accent)}
  .nbar{grid-template-columns:5.6em minmax(0,1fr) 6.6em;font-size:.82rem}
}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s ease}}
</style>

  <div class="wrap">

/* ---------- store ---------- */
const COLLS=['exercise','books','reading','meals','foods'];
const S={profile:{},exercise:[],books:[],reading:[],meals:[],foods:[]};
const Store={mode:'pending',base:null,ready:false,q:Promise.resolve(),
  async init(){
    let db=null,uid=null;
    try{ if(window.claude&&window.claude.use){
      const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
      db=d; uid=u? await u.id():null; } }catch(e){db=null}
    if(db&&uid){
      this.mode='db'; this.base=db.doc('data/users/'+uid+'/lifelog');
      let pending=COLLS.length+1;
      const done=()=>{if(--pending===0){this.ready=true;setSync();}};
      let firstP=true;
      this.base.onSnapshot(s=>{S.profile=s.exists?{...s.data()}:{};if(firstP){firstP=false;done()}schedule()},e=>this.fail(e));
      COLLS.forEach(c=>{let first=true;this.base.collection(c).onSnapshot(qs=>{S[c]=qs.docs.map(d=>({...d.data(),id:d.id}));if(first){first=false;done()}schedule()},e=>this.fail(e))});
    }else{
      this.mode='local';
      try{const raw=localStorage.getItem('lifelog.v1');if(raw){const o=JSON.parse(raw);Object.keys(S).forEach(k=>{if(o[k])S[k]=o[k]})}}catch(e){this.mode='memory'}
      this.ready=true; setSync(); schedule();
    }
  },
  fail(e){console.warn(e);toast('저장소 연결이 끊겼어요. 페이지를 새로 고쳐 주세요.')},
  saveLocal(){try{localStorage.setItem('lifelog.v1',JSON.stringify(S))}catch(e){}autoSync()},
  run(fn){this.q=this.q.then(fn).catch(e=>{console.warn(e);toast(e&&e.code==='quota_exceeded'?'저장 공간이 가득 찼어요.':'저장하지 못했어요. 잠시 후 다시 시도해 주세요.')});return this.q},
  put(c,rec){if(!rec.id)rec.id=rid();const clean=JSON.parse(JSON.stringify(rec));
    if(this.mode==='db'){return this.run(()=>this.base.collection(c).doc(clean.id).set(clean))}
    const i=S[c].findIndex(x=>x.id===clean.id);if(i>=0)S[c][i]=clean;else S[c].push(clean);this.saveLocal();schedule();return Promise.resolve()},
  del(c,id){if(this.mode==='db'){return this.run(()=>this.base.collection(c).doc(id).delete())}
    S[c]=S[c].filter(x=>x.id!==id);this.saveLocal();schedule();return Promise.resolve()},
  setProfile(patch){const p=JSON.parse(JSON.stringify({...S.profile,...patch}));
    if(this.mode==='db'){S.profile=p;schedule();return this.run(()=>this.base.set(p))}
    S.profile=p;this.saveLocal();schedule();return Promise.resolve()}
};
function setSync(){const c=$('#syncChip'),t=$('#syncText');
  if(Store.mode==='db'){c.classList.add('on');t.textContent='계정에 저장'}
  else if(Store.mode==='local'){t.textContent='이 브라우저에 저장'}
  else t.textContent='임시 저장(새로 고치면 사라짐)';}
function guard(){if(!Store.ready){toast('기록을 불러오는 중이에요. 잠시만요.');return false}return true}

/* ---------- derived ---------- */
const exTypes=()=>[...new Set([...EX_DEFAULT,...(S.profile.exTypes||[]),...S.exercise.map(e=>e.type)])];
const genres=()=>[...new Set([...GENRE_DEFAULT,...(S.profile.genres||[]),...S.books.map(b=>b.genre).filter(Boolean)])];
const allFoods=()=>[...BUILTIN,...S.foods.map(f=>({...f,cat:'직접 등록'}))];
const weight=()=>+S.profile.weight||(S.profile.sex==='F'?57:70);
const INTENSITY={low:['가볍게','숨이 차지 않음',0.8],mid:['보통','약간 숨참, 대화 가능',1],high:['격렬하게','숨이 많이 참, 대화 어려움',1.25]};
const exKcal=e=>Math.round((MET[e.type]||5)*(INTENSITY[e.intensity||'mid']||INTENSITY.mid)[2]*weight()*(e.minutes||0)/60);
const exOn=d=>S.exercise.filter(e=>e.date===d);
const rdOn=d=>S.reading.filter(r=>r.date===d);
const mealsOn=d=>S.meals.filter(m=>m.date===d);
const sumMin=a=>a.reduce((s,x)=>s+(+x.minutes||0),0);
const hasProfile=()=>!!(S.profile.sex&&S.profile.age&&S.profile.height&&S.profile.weight);

function dri(){
  const p=S.profile,male=p.sex!=='F',a=+p.age||30,w=weight(),h=+p.height||(male?173:160);
  const bmr=10*w+6.25*h-5*a+(male?5:-161);
  const af={low:1.4,mid:1.6,high:1.8}[p.activity||'mid'];
  const kcal=Math.round(bmr*af/10)*10;
  return {kcal,carb:kcal*.6/4,prot:male?(a<50?65:60):(a<30?55:50),fat:kcal*.25/9,fiber:male?30:20,sugar:kcal*.2/4,
    na:2300,ca:male?(a<50?800:750):(a<50?700:800),fe:male?(a<65?10:9):(a<50?14:8),k:3500,mg:male?(a<30?360:370):280,
    zn:male?(a<50?10:9):(a<50?8:7),va:male?(a<50?800:a<65?750:700):(a<50?650:600),vc:100,vd:a<65?10:15,b12:2.4,fol:400};
}
function intake(d){const t={};NK.forEach(k=>t[k]=0);mealsOn(d).forEach(m=>NK.forEach(k=>t[k]+=+(m.n&&m.n[k])||0));return t}
function goalFor(d){const g=dri();g.kcal+=exOn(d).reduce((s,e)=>s+exKcal(e),0);g.carb=g.kcal*.6/4;g.fat=g.kcal*.25/9;g.sugar=g.kcal*.2/4;return g}
/* period: returns {amt, goal, days} averaged over days that have meal records */
function period(endD,len){
  const days=[];for(let i=0;i<len;i++){const d=addDays(endD,-i);if(mealsOn(d).length)days.push(d)}
  const amt={},goal={};NK.forEach(k=>{amt[k]=0;goal[k]=0});
  days.forEach(d=>{const t=intake(d),g=goalFor(d);NK.forEach(k=>{amt[k]+=t[k];goal[k]+=g[k]})});
  if(days.length)NK.forEach(k=>{amt[k]/=days.length;goal[k]/=days.length});
  else{const g=goalFor(endD);NK.forEach(k=>goal[k]=g[k])}
  return {amt,goal,days:days.length};
}
function status(k,amt,goal){const pct=goal?amt/goal*100:0;
  if(LIMITS.includes(k))return amt>goal?'high':'ok';
  if(UL[k]&&amt>UL[k])return 'high';
  if(k==='kcal'&&pct>120)return 'high';
  if(k==='fat'&&pct>140)return 'high';
  if(pct<70)return 'low';return 'ok';}
function score(p){if(!p.days)return null;const ks=NK.filter(k=>!LIMITS.includes(k));
  let s=ks.reduce((a,k)=>a+Math.min(100,p.amt[k]/p.goal[k]*100),0)/ks.length;
  NK.forEach(k=>{if(status(k,p.amt[k],p.goal[k])==='high')s-=8});return Math.max(0,Math.round(s));}
function richFoods(k,n=4){
  return BUILTIN.filter(f=>f.n.kcal<=600&&f.n.na<=1000&&f.n[k]>0).map(f=>({f,v:f.n[k]})).sort((a,b)=>b.v-a.v).slice(0,n);
}
function streak(){const set=new Set(S.exercise.map(e=>e.date));let d=today();if(!set.has(d))d=addDays(d,-1);let n=0;while(set.has(d)){n++;d=addDays(d,-1)}return n}
function weekStart(d){const x=parseD(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return ymd(x)}
function inRange(d,a,b){return d>=a&&d<=b}

/* ---------- routing ---------- */
const VIEWS=['home','exercise','reading','diet','stats'];
let view='home';
const ui={dietDate:today(),dietPeriod:'today',calMonth:null,rdQuery:'',rdGenre:'전체',statNut:'prot',statLen:7};
function route(){const h=(location.hash||'').slice(1);view=VIEWS.includes(h)?h:'home';
  document.querySelectorAll('#tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.v===view?'page':'false'));render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);

let raf=0;function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render()})}
const charts={};function killCharts(){Object.keys(charts).forEach(k=>{charts[k].destroy();delete charts[k]})}

function render(){
  if(sheetOpen)return; // keep sheets stable; re-render after closing
  killCharts();
  const m=$('#main');
  m.innerHTML='<section class="view">'+({home:vHome,exercise:vExercise,reading:vReading,diet:vDiet,stats:vStats}[view])()+'</section>';
  afterRender[view]&&afterRender[view]();
}
const afterRender={};

/* ---------- small renderers ---------- */
function bar(k,amt,goal){const st=status(k,amt,goal);const pct=goal?amt/goal*100:0;
  return `<div class="nbar"><span class="nm"><i class="bg-${st}"></i>${NM[k][0]}</span>
  <span class="track" role="img" aria-label="${NM[k][0]} ${Math.round(pct)}%"><span class="fill bg-${st}" style="width:${Math.min(100,pct).toFixed(1)}%"></span></span>
  <span class="amt">${fmtN(k,amt)}/${fmtN(k,goal)}${NM[k][1]} · ${Math.round(pct)}%</span></div>`}
function ring(v,color){const r=34,c=2*Math.PI*r,p=v==null?0:v/100;
  return `<svg class="ring" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="8"/>
  <circle cx="42" cy="42" r="${r}" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 42 42)"/>
  <text x="42" y="48" text-anchor="middle" font-size="19">${v==null?'–':v}</text></svg>`}
function emptyState(msg,btn){return `<div class="empty"><p>${msg}</p>${btn||''}</div>`}
const sampleBtn=()=>S.exercise.length+S.reading.length+S.meals.length===0?`<button class="btn sm" data-act="sample" type="button">예시 데이터로 둘러보기</button>`:'';

/* ---------- HOME ---------- */
function vHome(){
  const d=today(),ex=exOn(d),rd=rdOn(d),ml=mealsOn(d),p=period(d,1),sc=score(p);
  const lows=p.days?NK.filter(k=>!LIMITS.includes(k)&&status(k,p.amt[k],p.goal[k])==='low').sort((a,b)=>p.amt[a]/p.goal[a]-p.amt[b]/p.goal[b]).slice(0,2):[];
  const highs=p.days?LIMITS.filter(k=>status(k,p.amt[k],p.goal[k])==='high'):[];
  let alert='';
  if(!p.days)alert='오늘 먹은 음식을 기록하면 부족한 영양소를 알려 드려요.';
  else{const parts=[];if(lows.length)parts.push(lows.map(k=>`<b>${NM[k][0]}</b>`).join(', ')+'이(가) 가장 부족해요');if(highs.length)parts.push(highs.map(k=>`<b>${NM[k][0]}</b>`).join(', ')+'은(는) 권장량을 넘었어요');alert=parts.join('. ')+(parts.length?'.':'영양 균형이 좋아요.')}
  const ws=weekStart(d),we=addDays(ws,6);
  return `
  <div class="quick">
    <button class="btn" data-act="add-ex" type="button"><span class="c-ex">●</span><b>운동 추가</b></button>
    <button class="btn" data-act="add-rd" type="button"><span class="c-rd">●</span><b>독서 추가</b></button>
    <button class="btn" data-act="add-food" type="button"><span class="c-diet">●</span><b>음식 추가</b></button>
  </div>
  ${S.exercise.length+S.reading.length+S.meals.length===0&&Store.ready?`<div class="panel">${emptyState('아직 기록이 없어요. 위 버튼으로 첫 기록을 남기거나, 예시 데이터로 화면을 먼저 둘러보세요.',sampleBtn())}</div>`:''}
  <div>
    <div class="sec-head"><h2>오늘</h2><span class="sub">${fmtD(d)}</span></div>
  </div>
  <div class="grid g3 stack">
    <div class="panel stat"><span class="label c-ex">운동</span><span class="v">${sumMin(ex)}<small>분</small></span><span class="k">${ex.length?ex.map(e=>esc(e.type)).join(' · ')+' · '+ex.reduce((s,e)=>s+exKcal(e),0)+'kcal 소모':'기록 없음'}</span></div>
    <div class="panel stat"><span class="label c-rd">독서</span><span class="v">${sumMin(rd)}<small>분</small></span><span class="k">${rd.length?[...new Set(rd.map(r=>bookTitle(r.bookId)))].map(esc).join(' · '):'기록 없음'}</span></div>
    <div class="panel stat"><span class="label c-diet">식단</span><span class="v">${fmtN('kcal',p.amt.kcal)}<small>/ ${fmtN('kcal',p.goal.kcal)} kcal</small></span><span class="k">${ml.length?ml.length+'가지 음식 기록':'기록 없음'}</span></div>
  </div>
  <div class="panel meter">${ring(sc,cssVarSafe('--accent'))}<div><div class="label">오늘의 영양 점수</div><p style="margin:4px 0 0">${alert}</p>${p.days?`<a href="#diet" class="btn ghost sm" style="padding-left:0">자세히 보기 →</a>`:''}</div></div>
  <div class="panel">
    <div class="sec-head"><h2 style="font-size:1.05rem">이번 주</h2><span class="sub num">${fmtD(ws)} – ${fmtD(we)}</span></div>
    <div class="chart-box sm"><canvas id="cWeek" aria-label="이번 주 요일별 운동과 독서 시간"></canvas></div>
  </div>
  <div class="panel">${calendar()}</div>`;
}
function cssVarSafe(n){return 'var('+n+')'}
afterRender.home=()=>{
  const ws=weekStart(today()),days=[...Array(7)].map((_,i)=>addDays(ws,i));
  barChart('cWeek',days.map(d=>DOW[parseD(d).getDay()]),[
    {label:'운동(분)',data:days.map(d=>sumMin(exOn(d))),backgroundColor:cssVar('--ex')},
    {label:'독서(분)',data:days.map(d=>sumMin(rdOn(d))),backgroundColor:cssVar('--rd')}]);
};
function calendar(){
  const base=ui.calMonth||today().slice(0,7);const [y,m]=base.split('-').map(Number);
  const first=new Date(y,m-1,1),days=new Date(y,m,0).getDate(),off=first.getDay();
  const exS=new Set(S.exercise.map(e=>e.date)),rdS=new Set(S.reading.map(e=>e.date)),mlS=new Set(S.meals.map(e=>e.date));const t=today();
  let cells=DOW.map(w=>`<div class="dow">${w}</div>`).join('');
  for(let i=0;i<off;i++)cells+='<div class="d out"></div>';
  for(let i=1;i<=days;i++){const d=y+'-'+pad(m)+'-'+pad(i);
    cells+=`<div class="d${d===t?' today':''}"><span>${i}</span><span class="dots">${exS.has(d)?'<i style="background:var(--ex)"></i>':''}${rdS.has(d)?'<i style="background:var(--rd)"></i>':''}${mlS.has(d)?'<i style="background:var(--diet)"></i>':''}</span></div>`}
  return `<div class="sec-head" style="margin-bottom:10px"><h2 style="font-size:1.05rem">${y}년 ${m}월</h2>
   <span class="calnav"><button class="btn ghost sm" data-act="cal" data-dir="-1" type="button" aria-label="이전 달">‹</button><button class="btn ghost sm" data-act="cal" data-dir="0" type="button">이번 달</button><button class="btn ghost sm" data-act="cal" data-dir="1" type="button" aria-label="다음 달">›</button></span></div>
   <div class="cal">${cells}</div>
   <div class="legend" style="margin-top:10px"><span><i style="background:var(--ex)"></i>운동</span><span><i style="background:var(--rd)"></i>독서</span><span><i style="background:var(--diet)"></i>식단</span></div>`;
}

/* ---------- EXERCISE ---------- */
function vExercise(){
  const t=today(),ws=weekStart(t),ms=t.slice(0,8)+'01';
  const wk=S.exercise.filter(e=>inRange(e.date,ws,t)),mo=S.exercise.filter(e=>inRange(e.date,ms,t));
  const sorted=[...S.exercise].sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
  let list='',last='';
  sorted.forEach(e=>{if(e.date!==last){list+=`<div class="daylabel">${fmtD(e.date)}</div>`;last=e.date}
    list+=`<div class="row"><span class="tag c-ex">${esc(e.type)}</span><div class="main"><div class="m">${['강도 '+(INTENSITY[e.intensity||'mid']||INTENSITY.mid)[0],e.start&&e.end?e.start+'–'+e.end:'',e.note?esc(e.note):''].filter(Boolean).join(' · ')||'&nbsp;'}</div></div>
    <span class="r">${e.minutes}분 · ${exKcal(e)}kcal</span><button class="btn ghost sm" data-act="edit-ex" data-id="${e.id}" type="button">수정</button></div>`});
  return `<div class="sec-head"><h2>운동</h2><button class="btn primary" data-act="add-ex" type="button">운동 기록하기</button></div>
  <div class="grid g3 stack">
    <div class="panel stat"><span class="k">이번 주</span><span class="v">${fmtMin(sumMin(wk))}</span><span class="k">${wk.length}회</span></div>
    <div class="panel stat"><span class="k">이번 달</span><span class="v">${fmtMin(sumMin(mo))}</span><span class="k">${mo.reduce((s,e)=>s+exKcal(e),0).toLocaleString()}kcal 소모</span></div>
    <div class="panel stat"><span class="k">연속 운동</span><span class="v">${streak()}<small>일</small></span><span class="k">오늘 또는 어제까지 이어진 날</span></div>
  </div>
  <div class="panel"><div class="list">${list||emptyState('운동 기록이 없어요. 오늘 한 운동을 남겨 보세요.',sampleBtn())}</div></div>
  <p class="note">소모 칼로리는 운동 종류별 MET 값 × 체중 × 시간으로 추정하고, 강도에 따라 가볍게 ×0.8, 격렬하게 ×1.25를 적용해요.</p>`;
}

/* ---------- READING ---------- */
function bookTitle(id){const b=S.books.find(b=>b.id===id);return b?b.title:'(삭제된 책)'}
function bookMin(id){return sumMin(S.reading.filter(r=>r.bookId===id))}
function stars(n){n=+n||0;return '★'.repeat(n)+'☆'.repeat(5-n)}
function hl(text,q){const s=esc(text);if(!q)return s;const re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/&/g,'&amp;').replace(/</g,'&lt;'),'gi');return s.replace(re,m=>`<mark class="hl">${m}</mark>`)}
function vReading(){
  const t=today(),ms=t.slice(0,8)+'01';
  const moMin=sumMin(S.reading.filter(r=>inRange(r.date,ms,t)));
  const doneMo=S.books.filter(b=>b.status==='done'&&b.doneDate&&inRange(b.doneDate,ms,t)).length;
  const order={reading:0,done:1,stop:2};
  const books=[...S.books].sort((a,b)=>(order[a.status]??3)-(order[b.status]??3)||(b.ts||0)-(a.ts||0));
  const groups={};books.forEach(b=>{const g=(b.genre||'').trim()||'장르 없음';(groups[g]=groups[g]||[]).push(b)});
  const gorder=genres();const gnames=Object.keys(groups).sort((a,b)=>{const ia=a==='장르 없음'?1e9:(gorder.indexOf(a)<0?1e8:gorder.indexOf(a)),ib=b==='장르 없음'?1e9:(gorder.indexOf(b)<0?1e8:gorder.indexOf(b));return ia-ib||a.localeCompare(b,'ko')});
  if(ui.rdGenre!=='전체'&&!groups[ui.rdGenre])ui.rdGenre='전체';
  const q=ui.rdQuery.trim().toLowerCase();
  let results='';
  if(q){const hits=S.reading.filter(r=>((r.note||'')+' '+bookTitle(r.bookId)).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));
    results=`<div class="panel"><div class="label" style="margin-bottom:6px">"${esc(ui.rdQuery)}" 검색 결과 ${hits.length}건</div><div class="list">${hits.map(r=>`<div class="row"><div class="main"><div class="t">${hl(bookTitle(r.bookId),ui.rdQuery)}</div><div class="m">${fmtD(r.date)} · ${r.minutes}분</div>${r.note?`<div class="quote">${hl(r.note,ui.rdQuery)}</div>`:''}</div></div>`).join('')||emptyState('일치하는 독서 기록이 없어요.')}</div></div>`}
  return `<div class="sec-head"><h2>독서</h2><span class="quick" style="flex:none"><button class="btn" data-act="add-book" type="button">책 추가</button><button class="btn primary" data-act="add-rd" type="button">독서 기록하기</button></span></div>
  <div class="grid g3 stack">
    <div class="panel stat"><span class="k">이번 달 독서 시간</span><span class="v">${fmtMin(moMin)}</span></div>
    <div class="panel stat"><span class="k">이번 달 완독</span><span class="v">${doneMo}<small>권</small></span></div>
    <div class="panel stat"><span class="k">읽는 중</span><span class="v">${S.books.filter(b=>b.status==='reading').length}<small>권</small></span></div>
  </div>
  <input class="search" id="rdSearch" type="search" placeholder="독서 기록·책 제목 검색" value="${esc(ui.rdQuery)}" aria-label="독서 기록 검색">
  ${results}
  ${S.books.length?`<div class="favs" role="group" aria-label="장르로 보기">${['전체',...gnames].map(g=>`<button type="button" data-act="rgenre" data-v="${esc(g)}" aria-pressed="${ui.rdGenre===g}">${esc(g)} <span class="num" style="opacity:.7">${g==='전체'?S.books.length:(groups[g]||[]).length}</span></button>`).join('')}</div>`:''}
  ${S.books.length?gnames.filter(g=>ui.rdGenre==='전체'||ui.rdGenre===g).map(g=>{const bs=groups[g];const mins=bs.reduce((s,b)=>s+bookMin(b.id),0);
    return `<div class="panel"><div class="sec-head" style="margin-bottom:4px"><h2 style="font-size:1.08rem">${esc(g)}</h2><span class="sub num">${bs.length}권 · 완독 ${bs.filter(b=>b.status==='done').length}권 · ${fmtMin(mins)}</span></div><div class="list">${bs.map(bookRow).join('')}</div></div>`}).join(''):`<div class="panel">${emptyState('등록한 책이 없어요. 읽고 있는 책을 추가해 보세요.',sampleBtn())}</div>`}`;
}
function bookRow(b){const n=S.reading.filter(r=>r.bookId===b.id).length;
    return `<button class="book" data-act="open-book" data-id="${b.id}" type="button"><span class="spine" style="${b.status==='done'?'background:var(--ok)':b.status==='stop'?'background:var(--muted)':''}"></span>
    <span class="main"><span class="t">${esc(b.title)}</span><br><span class="m" style="color:var(--muted);font-size:.85rem">${esc(b.author||'저자 미상')} · ${esc(b.genre||'장르 없음')} · ${n}회 · ${fmtMin(bookMin(b.id))}</span>
    ${b.status==='done'&&b.rating?`<br><span class="stars" aria-label="별점 ${b.rating}점">${stars(b.rating)}</span> <span style="font-size:.85rem">${esc(b.review||'')}</span>`:''}</span>
    <span class="tag ${b.status==='done'?'c-ok':b.status==='reading'?'c-rd':''}" style="${b.status==='stop'?'color:var(--muted)':''}">${STATUS[b.status]||'읽는 중'}</span></button>`;
}
afterRender.reading=()=>{const s=$('#rdSearch');if(!s)return;let t;s.addEventListener('input',()=>{clearTimeout(t);t=setTimeout(()=>{ui.rdQuery=s.value;const pos=s.selectionStart;render();const n=$('#rdSearch');n.focus();n.setSelectionRange(pos,pos)},250)})};

/* ---------- DIET ---------- */
function vDiet(){
  const d=ui.dietDate,ml=mealsOn(d);
  const len=ui.dietPeriod==='today'?1:7;const p=period(d,len);
  let meals='';
  MEALS.forEach(([k,lb])=>{const items=ml.filter(m=>m.meal===k);const kc=items.reduce((s,m)=>s+(m.n?.kcal||0),0);
    meals+=`<div class="meal"><div class="meal-head"><b>${lb}</b><span><span class="r">${Math.round(kc)}kcal</span> <button class="btn ghost sm" data-act="add-food" data-meal="${k}" type="button">+ 추가</button></span></div>
    <div class="list">${items.map(m=>`<div class="row"><div class="main"><div class="t">${esc(m.name)}</div><div class="m">${esc(m.amountLabel||'')}</div></div><span class="r">${Math.round(m.n?.kcal||0)}kcal</span><button class="btn ghost sm" data-act="del-food" data-id="${m.id}" type="button" aria-label="${esc(m.name)} 삭제">삭제</button></div>`).join('')}</div></div>`});
  const sc=score(p);
  let bars='';GROUPS.forEach(([g,ks])=>{bars+=`<div class="label" style="margin-top:12px">${g}</div>`+ks.map(k=>bar(k,p.amt[k],p.goal[k])).join('')});
  const lows=NK.filter(k=>!LIMITS.includes(k)&&status(k,p.amt[k],p.goal[k])==='low').sort((a,b)=>p.amt[a]/p.goal[a]-p.amt[b]/p.goal[b]);
  const highs=NK.filter(k=>status(k,p.amt[k],p.goal[k])==='high');
  const defs=lows.map(k=>{const gap=p.goal[k]-p.amt[k];const rf=richFoods(k);const top=rf[0];
    const sug=top?`다음 식사에 <b>${esc(top.f.name)} ${esc(top.f.serv)}</b>을(를) 더하면 부족분의 약 ${Math.min(100,Math.round(top.v/gap*100))}%를 채울 수 있어요.`:'';
    return `<div class="def"><h3>${NM[k][0]} <span class="tag c-low">${Math.round(p.amt[k]/p.goal[k]*100)}%</span><span class="sub" style="font-size:.82rem;color:var(--muted);font-weight:400">${fmtN(k,gap)}${NM[k][1]} 부족</span></h3>
    <p>${WHY[k]}</p><div class="foods">${rf.map(x=>`<span>${esc(x.f.name)} ${esc(x.f.serv)} · ${fmtN(k,x.v)}${NM[k][1]}</span>`).join('')}</div>
    ${sug?`<div class="suggest">${sug}</div>`:''}${SUPP[k]?`<p class="note">${SUPP[k]}</p>`:''}</div>`}).join('');
  const exc=highs.map(k=>`<div class="def"><h3>${NM[k][0]} <span class="tag c-high">${LIMITS.includes(k)?'권장 상한 초과':UL[k]&&p.amt[k]>UL[k]?'상한섭취량 초과':'많이 섭취'}</span><span style="font-size:.82rem;color:var(--muted);font-weight:400">${fmtN(k,p.amt[k])}${NM[k][1]} / 기준 ${fmtN(k,LIMITS.includes(k)?p.goal[k]:UL[k]&&p.amt[k]>UL[k]?UL[k]:p.goal[k])}${NM[k][1]}</span></h3><p>${EXCESS[k]||EXCESS._ul}</p></div>`).join('');
  const exk=exOn(d).reduce((s,e)=>s+exKcal(e),0);
  return `<div class="sec-head"><h2>식단 & 영양</h2><button class="btn primary" data-act="add-food" type="button">음식 추가</button></div>
  ${!hasProfile()?`<div class="panel" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between"><span>성별·나이·키·체중을 입력하면 나에게 맞는 권장 섭취량으로 계산해요. 지금은 성인 기준값을 쓰고 있어요.</span><button class="btn sm" data-act="settings" type="button">내 정보 입력</button></div>`:''}
  <div class="datebar"><button class="btn ghost sm" data-act="dday" data-dir="-1" type="button" aria-label="전날">‹</button><input type="date" id="dietDate" value="${d}" aria-label="날짜"><button class="btn ghost sm" data-act="dday" data-dir="1" type="button" aria-label="다음 날">›</button>${d!==today()?'<button class="btn ghost sm" data-act="dday" data-dir="0" type="button">오늘</button>':''}</div>
  <div class="grid g2 stack">
    <div class="panel"><div class="label">먹은 음식</div>${ml.length?'':emptyState('이 날 기록한 음식이 없어요.',sampleBtn())}${meals}</div>
    <div class="panel" style="display:flex;flex-direction:column;gap:12px">
      <div class="sec-head"><span class="label">영양 분석</span><span class="seg" role="group" aria-label="분석 기간"><button type="button" data-act="dper" data-v="today" aria-pressed="${ui.dietPeriod==='today'}">이 날</button><button type="button" data-act="dper" data-v="7d" aria-pressed="${ui.dietPeriod==='7d'}">최근 7일 평균</button></span></div>
      <div class="meter">${ring(sc,'var(--accent)')}<div><div style="font-weight:600">영양 점수</div><div class="sub" style="color:var(--muted);font-size:.85rem">${p.days?`권장량 충족도 기준${len>1?` · 기록한 ${p.days}일 평균`:''}`:'음식을 기록하면 계산돼요'}<br>칼로리 목표 ${fmtN('kcal',p.goal.kcal)}kcal${exk&&len===1?` (운동 ${exk}kcal 반영)`:''}</div></div></div>

  // frequently deficient over 30 days
  const cnt={};let dd=0;for(let i=0;i<30;i++){const d=addDays(t,-i);if(!mealsOn(d).length)continue;dd++;const a=intake(d),g=goalFor(d);NK.forEach(k=>{if(!LIMITS.includes(k)&&status(k,a[k],g[k])==='low')cnt[k]=(cnt[k]||0)+1})}

  <div class="panel"><div class="label c-rd">독서</div>

    ${S.books.length?'<div class="label">장르별 독서 시간 (전체)</div><div class="chart-box sm"><canvas id="cGenre" aria-label="장르별 독서 비율"></canvas></div>':emptyState('책을 추가하면 장르별 비율을 보여 드려요.')}</div>

    <span style="display:flex;gap:8px;flex-wrap:wrap"><select id="statNut" class="btn sm" aria-label="영양소 선택">${NK.map(k=>`<option value="${k}"${k===ui.statNut?' selected':''}>${NM[k][0]}</option>`).join('')}</select>
    <span class="seg" role="group" aria-label="기간"><button type="button" data-act="slen" data-v="7" aria-pressed="${ui.statLen===7}">7일</button><button type="button" data-act="slen" data-v="30" aria-pressed="${ui.statLen===30}">30일</button></span></span></div>
    <div class="chart-box" style="margin-top:10px"><canvas id="cNut" aria-label="영양소 섭취 추이"></canvas></div>
    <p class="note" style="margin-top:10px">권장량 대비 비율(%)이에요. 점선은 100%, 음식을 기록하지 않은 날은 비어 있어요.</p>

afterRender.stats=()=>{
  const t=today(),ms=t.slice(0,8)+'01';const pal=[cssVar('--ex'),cssVar('--rd'),cssVar('--diet'),cssVar('--accent'),cssVar('--high'),cssVar('--muted'),cssVar('--low')];
  if($('#cExType')){const m={};S.exercise.filter(e=>inRange(e.date,ms,t)).forEach(e=>m[e.type]=(m[e.type]||0)+(+e.minutes||0));const ks=Object.keys(m);
    if(ks.length)donut('cExType',ks,ks.map(k=>m[k]),pal);else $('#cExType').parentElement.outerHTML=emptyState('이번 달 운동 기록이 아직 없어요.')}
  if($('#cGenre')){const m={};S.reading.forEach(r=>{const b=S.books.find(x=>x.id===r.bookId);const g=(b&&b.genre)||'기타';m[g]=(m[g]||0)+(+r.minutes||0)});const ks=Object.keys(m);
    if(ks.length)donut('cGenre',ks,ks.map(k=>m[k]),pal);else $('#cGenre').parentElement.outerHTML=emptyState('독서 기록이 쌓이면 장르별 비율을 보여 드려요.')}
  const k=ui.statNut,n=ui.statLen;const days=[...Array(n)].map((_,i)=>addDays(t,i-n+1));

/* ---------- charts ---------- */
function baseOpts(){const tc=cssVar('--muted'),gc=cssVar('--line');Chart.defaults.font.family=cssVar('--f-body');
  return {responsive:true,maintainAspectRatio:false,animation:matchMedia('(prefers-reduced-motion: reduce)').matches?false:{duration:400},
  plugins:{legend:{labels:{color:tc,boxWidth:10,boxHeight:10,usePointStyle:true}}},
  scales:{x:{ticks:{color:tc},grid:{display:false},border:{color:gc}},y:{ticks:{color:tc},grid:{color:gc},border:{display:false},beginAtZero:true}}}}
function barChart(id,labels,ds){const el=$('#'+id);if(!el||!window.Chart)return;const o=baseOpts();
  charts[id]=new Chart(el,{type:'bar',data:{labels,datasets:ds.map(d=>({...d,borderRadius:4,maxBarThickness:18}))},options:o})}
function donut(id,labels,data,pal){const el=$('#'+id);if(!el||!window.Chart)return;const o=baseOpts();delete o.scales;o.plugins.legend.position='right';
  o.plugins.tooltip={callbacks:{label:c=>' '+c.label+': '+fmtMin(c.raw)}};
  charts[id]=new Chart(el,{type:'doughnut',data:{labels,datasets:[{data,backgroundColor:labels.map((_,i)=>pal[i%pal.length]),borderColor:cssVar('--surface'),borderWidth:2}]},options:{...o,cutout:'62%'}})}
function lineChart(id,labels,data,name){const el=$('#'+id);if(!el||!window.Chart)return;const o=baseOpts();const ac=cssVar('--accent');
  o.plugins.legend.display=false;o.scales.y.ticks.callback=v=>v+'%';o.plugins.tooltip={callbacks:{label:c=>' '+name+' '+c.raw+'%'}};
  const max=Math.max(120,...data.filter(v=>v!=null))*1.08;o.scales.y.suggestedMax=max;
  charts[id]=new Chart(el,{type:'line',data:{labels,datasets:[
    {data,borderColor:ac,backgroundColor:ac+'22',fill:true,tension:.3,pointRadius:3,pointBackgroundColor:ac,spanGaps:false},
    {data:labels.map(()=>100),borderColor:cssVar('--muted'),borderDash:[4,4],borderWidth:1,pointRadius:0,fill:false}]},options:o})}

/* ---------- sheets ---------- */
let sheetOpen=false;
function openSheet(title,body,onMount){
  sheetOpen=true;const root=$('#sheetRoot');
  root.innerHTML=`<div class="backdrop" id="bd"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"><div class="sheet-head"><h2 id="shTitle">${title}</h2><button class="btn ghost" data-close type="button" aria-label="닫기">닫기</button></div>${body}</div></div>`;
  const bd=$('#bd');bd.addEventListener('click',e=>{if(e.target===bd||e.target.closest('[data-close]'))closeSheet()});
  document.addEventListener('keydown',escClose);onMount&&onMount(bd);
  const f=bd.querySelector('input:not([type=hidden]),select,textarea');f&&setTimeout(()=>f.focus({preventScroll:true}),30);
}
function escClose(e){if(e.key==='Escape')closeSheet()}
function closeSheet(){sheetOpen=false;$('#sheetRoot').innerHTML='';document.removeEventListener('keydown',escClose);render()}
function confirmIn(container,msg,onYes){const box=document.createElement('div');box.className='picked';
  box.innerHTML=`<span>${msg}</span><span style="display:flex;gap:6px"><button class="btn sm" type="button" data-n>취소</button><button class="btn sm danger" type="button" data-y>삭제</button></span>`;
  container.appendChild(box);box.querySelector('[data-n]').onclick=()=>box.remove();box.querySelector('[data-y]').onclick=onYes;box.querySelector('[data-y]').focus()}
function selectWithCustom(id,label,opts,val){
  const has=!val||opts.includes(val);
  return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${opts.map(o=>`<option${o===val?' selected':''}>${esc(o)}</option>`).join('')}${!has?`<option selected>${esc(val)}</option>`:''}<option value="__new">+ 직접 입력</option></select>
  <input id="${id}_new" placeholder="새 ${label} 이름" hidden></div>`}
function wireCustom(bd,id){const s=bd.querySelector('#'+id),n=bd.querySelector('#'+id+'_new');s.addEventListener('change',()=>{n.hidden=s.value!=='__new';if(!n.hidden)n.focus()})}
function readCustom(bd,id){const s=bd.querySelector('#'+id);return s.value==='__new'?bd.querySelector('#'+id+'_new').value.trim():s.value}

/* exercise form: 30분 단위 드롭다운 */
function durOpts(cur){const v=[];for(let m=30;m<=300;m+=30)v.push(m);if(cur&&!v.includes(+cur))v.push(+cur);v.sort((a,b)=>a-b);
  return v.map(m=>`<option value="${m}"${m===+cur?' selected':''}>${fmtMin(m)}</option>`).join('')}
function clockOpts(cur){let h='<option value="">선택</option>';for(let t=0;t<1440;t+=30){const s=pad(Math.floor(t/60))+':'+pad(t%60);const hr=Math.floor(t/60);
  h+=`<option value="${s}"${s===cur?' selected':''}>${hr<12?'오전':'오후'} ${hr%12||12}:${pad(t%60)}</option>`}return h}
function exForm(e){

    <div class="field"><label for="exInt">운동 강도</label><select id="exInt">${Object.entries(INTENSITY).map(([k,v])=>`<option value="${k}"${k===(e.intensity||'mid')?' selected':''}>${v[0]} · ${v[1]}</option>`).join('')}</select></div>

      const sel=$('#exMin',bd);if(![...sel.options].some(o=>+o.value===m))sel.insertAdjacentHTML('beforeend',`<option value="${m}">${fmtMin(m)}</option>`);sel.value=m}};
    $('#exS',bd).addEventListener('change',calc);$('#exE',bd).addEventListener('change',calc);

/* food form */
function foodForm(meal){
  const now=new Date().getHours();meal=meal||(now<10?'breakfast':now<15?'lunch':now<21?'dinner':'snack');
  let picked=null;
  const favs=(S.profile.favs||[]).map(id=>allFoods().find(f=>f.id===id)).filter(Boolean);
  openSheet('음식 추가',`
  <div class="fields">
    <div class="field"><label for="fdMeal">식사</label><select id="fdMeal">${MEALS.map(([k,l])=>`<option value="${k}"${k===meal?' selected':''}>${l}</option>`).join('')}</select></div>
    <div class="field"><label for="fdDate">날짜</label><input type="date" id="fdDate" value="${ui.dietDate}"></div>
  </div>
  ${favs.length?`<div class="field"><span class="lb">즐겨찾기</span><div class="favs">${favs.map(f=>`<button type="button" data-fav="${f.id}">${esc(f.name)}</button>`).join('')}</div></div>`:''}
  <div class="field"><label for="fdQ">음식 검색</label><input id="fdQ" type="search" placeholder="예: 김치찌개, 현미밥, 바나나" autocomplete="off"></div>
  <div class="favs" id="fdCats" role="group" aria-label="음식 분류">${['전체',...new Set(allFoods().map(f=>f.cat))].map((c,i)=>`<button type="button" data-cat="${esc(c)}" aria-pressed="${i===0}">${esc(c)}</button>`).join('')}</div>

  <div class="actions"><button class="btn ghost" type="button" id="custom" style="margin-right:auto">목록에 없는 음식 직접 등록</button><button class="btn" type="button" data-close>닫기</button></div>`,bd=>{
    const res=$('#fdRes',bd),q=$('#fdQ',bd);
    let cat='전체';
    bd.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;bd.querySelectorAll('[data-cat]').forEach(x=>x.setAttribute('aria-pressed',x===b));res.hidden=false;list()});
    const list=()=>{const s=q.value.trim().toLowerCase();const fs=allFoods().filter(f=>(cat==='전체'||f.cat===cat)&&(!s||f.name.toLowerCase().includes(s)||f.cat.includes(s))).slice(0,cat==='전체'?40:200);
      res.innerHTML=fs.map(f=>`<button type="button" data-fid="${f.id}" role="option"><span>${esc(f.name)} <span class="m">${esc(f.serv)}</span></span><span class="m">${f.cat} · ${Math.round(f.n.kcal)}kcal</span></button>`).join('')||'<div class="empty"><p>찾는 음식이 없어요. 아래에서 직접 등록할 수 있어요.</p></div>'};
    list();q.addEventListener('input',list);
    const choose=id=>{picked=allFoods().find(f=>f.id===id);if(!picked)return;res.hidden=true;q.value=picked.name;showPick()};
    res.addEventListener('click',e=>{const b=e.target.closest('[data-fid]');b&&choose(b.dataset.fid)});
    bd.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>choose(b.dataset.fav));
    q.addEventListener('focus',()=>{res.hidden=false});
    const showPick=()=>{const f=picked;const isFav=(S.profile.favs||[]).includes(f.id);
      $('#pick',bd).innerHTML=`<div class="fields" style="background:var(--sunk);padding:12px;border-radius:8px">
        <div class="full" style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b>${esc(f.name)}</b><button class="btn ghost sm" type="button" id="favT" aria-pressed="${isFav}">${isFav?'★ 즐겨찾기 해제':'☆ 즐겨찾기'}</button></div>

      $('#favT',bd).onclick=()=>{const fv=S.profile.favs||[];const on=fv.includes(f.id);Store.setProfile({favs:on?fv.filter(x=>x!==f.id):[...fv,f.id]});const b=$('#favT',bd);b.setAttribute('aria-pressed',!on);b.textContent=!on?'★ 즐겨찾기 해제':'☆ 즐겨찾기'};
      $('#addF',bd).onclick=()=>{const x=factor();if(!(x>0)){toast('섭취량을 0보다 크게 입력해 주세요');return}
        const n={};NK.forEach(k=>n[k]=Math.round((f.n[k]||0)*x*100)/100);

        const date=$('#fdDate',bd).value||ui.dietDate;

        toast(`${f.name}을(를) 기록했어요`);picked=null;$('#pick',bd).innerHTML='';q.value='';res.hidden=false;list();q.focus()}};
    $('#custom',bd).onclick=()=>{closeSheet();customFoodForm()};
  });

async function exportData(out){
  const data=JSON.stringify({app:'하루 기록장',version:1,exportedAt:new Date().toISOString(),...S},null,2);
  const name='하루기록장-'+today()+'.json';
  if(!window.claude){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('내보냈어요');return}catch(e){}}
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:new Blob([data],{type:'application/json'})});toast('내보냈어요');return}}catch(e){if(e&&e.code==='declined')return}
  out.innerHTML=`<div class="field"><label for="expTxt">아래 내용을 복사해 .json 파일로 저장하세요</label><textarea id="expTxt" readonly style="min-height:140px;font-family:var(--f-num);font-size:.75rem"></textarea><button class="btn sm" type="button" id="cp">복사</button></div>`;
  const ta=$('#expTxt',out);ta.value=data;$('#cp',out).onclick=async()=>{try{await navigator.clipboard.writeText(data);toast('복사했어요')}catch(e){ta.select();toast('선택된 내용을 복사해 주세요')}};
}
async function importData(file,out){if(!file)return;
  try{const o=JSON.parse(await file.text());if(!o||typeof o!=='object')throw 0;
    let n=0;if(o.profile)await Store.setProfile(o.profile);
    for(const c of COLLS){for(const r of (o[c]||[])){if(r&&r.id){await Store.put(c,r);n++}}}
    out.innerHTML=`<p class="note">${n}개 기록을 가져왔어요.</p>`;toast('가져오기를 마쳤어요');
  }catch(e){out.innerHTML='<p class="err">이 파일을 읽지 못했어요. 하루 기록장에서 내보낸 JSON 파일인지 확인해 주세요.</p>'}}

      rows:[...S.reading].sort(byDate).map(r=>{const b=book(r.bookId);return [r.date,b.title||'',b.author||'',b.genre||'',+r.minutes||0,r.pageFrom??'',r.pageTo??'',r.note||'']})},
    '책 목록':{header:['제목','저자','장르','상태','별점','한 줄 평','완독일','총 독서 시간(분)','기록 횟수'],
      rows:S.books.map(b=>[b.title||'',b.author||'',b.genre||'',STATUS[b.status]||'',b.rating||'',b.review||'',b.doneDate||'',bookMin(b.id),S.reading.filter(r=>r.bookId===b.id).length])},
    '식단':{header:['날짜','식사','음식','섭취량',...nh],
      rows:[...S.meals].sort(byDate).map(m=>[m.date,mealName[m.meal]||m.meal,m.name,m.amountLabel||'',...NK.map(k=>r1(m.n&&m.n[k]))])},
    '일별 영양':{header:['날짜',...nh,'칼로리 목표(kcal)','영양 점수','부족한 영양소','초과 영양소'],
      rows:days.map(d=>{const p=period(d,1);return [d,...NK.map(k=>r1(p.amt[k])),Math.round(p.goal.kcal),score(p),
        NK.filter(k=>!LIMITS.includes(k)&&status(k,p.amt[k],p.goal[k])==='low').map(k=>NM[k][0]).join(', '),
        NK.filter(k=>status(k,p.amt[k],p.goal[k])==='high').map(k=>NM[k][0]).join(', ')]})}
  };
}
async function syncSheet(silent){
  const c=sheetCfg();
  if(!c.url||!c.secret){if(!silent)toast('웹 앱 주소와 비밀 키를 먼저 저장해 주세요');return false}
  if(window.claude){if(!silent)toast('claude.ai 화면에서는 외부로 보낼 수 없어요. 내려받은 파일이나 깃허브 주소에서 보내 주세요.');return false}
  const body=JSON.stringify({secret:c.secret,app:'하루 기록장',sentAt:new Date().toISOString(),sheets:sheetPayload()});
  const done=msg=>{c.last=new Date().toISOString();saveSheetCfg(c);if(!silent)toast(msg);const l=$('#gsLast');if(l)l.textContent=lastLabel(c);return true};
  try{
    const r=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'시트에서 거절했어요');
    return done('구글 시트로 보냈어요');
  }catch(e){
    if(e instanceof TypeError){try{await fetch(c.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body});return done('보냈어요. 시트에 반영됐는지 확인해 주세요')}catch(e2){}}
    if(!silent)toast('보내지 못했어요. '+(e.message&&!(e instanceof TypeError)?e.message:'웹 앱 주소를 확인해 주세요'));return false;
  }
}
function lastLabel(c){if(!c.last)return '아직 보낸 적 없음';const d=new Date(c.last);return '마지막 전송: '+fmtD(ymd(d))+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
let autoT;function autoSync(){const c=sheetCfg();if(!c.auto||!c.url||!c.secret||window.claude)return;clearTimeout(autoT);autoT=setTimeout(()=>syncSheet(true),4000)}

/* sample data */
async function loadSample(){if(!guard())return;toast('예시 데이터를 넣고 있어요');
  const t=today(),d=i=>addDays(t,-i);
  const b1={id:'s-b1',title:'채식주의자',author:'한강',genre:'소설',status:'reading',sample:true,ts:Date.now()};
  const b2={id:'s-b2',title:'아주 작은 습관의 힘',author:'제임스 클리어',genre:'자기계발',status:'done',rating:4,review:'작게 시작해서 꾸준히. 기록 앱을 만들게 된 이유.',doneDate:d(2),sample:true,ts:Date.now()-1};
  const ex=[[0,'러닝',30,'5km, 가볍게'],[1,'헬스',60,'하체 위주'],[2,'걷기',30,'퇴근길'],[4,'요가',30,'아침 스트레칭'],[5,'자전거',60,'한강 자전거길']].map(([i,type,m,note])=>({id:'s-e'+i,date:d(i),type,minutes:m,note,sample:true,ts:Date.now()-i}));
  const rd=[[0,'s-b1',30,112,140,'"나는 꿈을 꾸었어." 짧은 문장 하나가 장면을 통째로 바꾼다.'],[1,'s-b1',25,86,112,'가족의 시선으로만 그려지는 영혜. 정작 본인의 목소리는 없다.'],[2,'s-b2',40,280,320,'정체성 기반 습관: 결과가 아니라 어떤 사람이 되고 싶은지에서 시작하기.'],[3,'s-b2',35,230,280,'환경 설계. 좋은 습관은 눈에 띄게, 나쁜 습관은 보이지 않게.'],[5,'s-b2',45,170,230,'']].map(([i,b,m,pf,pt,note],j)=>({id:'s-r'+j,date:d(i),bookId:b,minutes:m,pageFrom:pf,pageTo:pt,note,sample:true,ts:Date.now()-j}));
  const plan={0:[['breakfast','그릭요거트',1],['breakfast','바나나',1],['lunch','김치찌개',1],['lunch','쌀밥',1],['snack','아메리카노',1],['dinner','닭가슴살 샐러드',1]],
    1:[['breakfast','버터잼 토스트',1],['lunch','비빔밥',1],['dinner','삼겹살 구이',1],['dinner','쌈채소',1],['dinner','맥주',1]],
    2:[['breakfast','오트밀(우유)',1],['lunch','라면',1],['lunch','배추김치',1],['dinner','고등어구이',1],['dinner','현미밥',1]],
    3:[['lunch','짜장면',1],['dinner','된장찌개',1],['dinner','잡곡밥',1],['snack','사과',1]],
    4:[['breakfast','삶은 계란',2],['lunch','김밥',1],['dinner','불고기',1],['dinner','쌀밥',1],['dinner','시금치나물',1]],
    5:[['lunch','돈까스',1],['dinner','미역국',1],['dinner','쌀밥',1],['snack','귤',2]],
    6:[['breakfast','우유',1],['lunch','쌀국수',1],['dinner','순두부찌개',1],['dinner','현미밥',1]]};
  const ml=[];Object.entries(plan).forEach(([i,arr])=>arr.forEach(([meal,name,q],j)=>{const f=BUILTIN.find(x=>x.name===name);if(!f)return;const n={};NK.forEach(k=>n[k]=Math.round(f.n[k]*q*100)/100);
    ml.push({id:'s-m'+i+'-'+j,date:d(+i),meal,foodId:f.id,name:f.name,amountLabel:q===1?`1인분 (${f.serv})`:`${q}${f.cnt||'인분'}`,n,sample:true,ts:Date.now()-j})}));
  for(const r of [b1,b2])await Store.put('books',r);for(const r of ex)await Store.put('exercise',r);for(const r of rd)await Store.put('reading',r);for(const r of ml)await Store.put('meals',r);
  toast('예시 데이터를 넣었어요. 내 정보에서 지울 수 있어요.');
}
async function clearSample(){for(const c of COLLS){for(const r of S[c].filter(x=>x.sample))await Store.del(c,r.id)}toast('예시 데이터를 지웠어요')}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a||a.closest('#sheetRoot'))return;const act=a.dataset.act;
  if(['add-ex','add-rd','add-book','add-food','edit-ex','open-book','sample'].includes(act)&&!guard())return;
  switch(act){
    case 'add-ex':exForm();break;
    case 'edit-ex':exForm(S.exercise.find(x=>x.id===a.dataset.id));break;
    case 'add-rd':rdForm();break;
    case 'add-book':bookForm();break;
    case 'open-book':bookSheet(a.dataset.id);break;
    case 'add-food':foodForm(a.dataset.meal);break;
    case 'del-food':{const m=S.meals.find(x=>x.id===a.dataset.id);if(m){Store.del('meals',m.id);toast(`${m.name} 기록을 삭제했어요`)}break}
    case 'settings':settingsSheet();break;
    case 'sample':loadSample();break;
    case 'cal':{const dir=+a.dataset.dir;if(!dir)ui.calMonth=null;else{const [y,m]=(ui.calMonth||today().slice(0,7)).split('-').map(Number);const x=new Date(y,m-1+dir,1);ui.calMonth=x.getFullYear()+'-'+pad(x.getMonth()+1)}render();break}
    case 'dday':{const dir=+a.dataset.dir;ui.dietDate=dir?addDays(ui.dietDate,dir):today();render();break}
    case 'rgenre':ui.rdGenre=a.dataset.v;render();break;
    case 'dper':ui.dietPeriod=a.dataset.v;render();break;
    case 'slen':ui.statLen=+a.dataset.v;render();break;
  }});
$('#btnSettings').addEventListener('click',settingsSheet);
const td=new Date();$('#todayLabel').textContent=td.getFullYear()+'년 '+fmtD(today());
if(window.matchMedia){const mq=matchMedia('(prefers-color-scheme: dark)');mq.addEventListener&&mq.addEventListener('change',()=>render())}
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

route();
Store.init();
})();
